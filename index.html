<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ironworker">
<meta name="theme-color" content="#1f2a36">
<title>EMPRO Ironworker</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header>
  <h1>EMPRO Ironworker</h1>
  <nav role="tablist">
    <button role="tab" data-tab="punch" aria-selected="true">Punch</button>
    <button role="tab" data-tab="tooling">Tooling</button>
  </nav>
</header>
<main>
  <section id="punch" class="panel active">
    <div class="grid">
      <form class="card inputs" id="jForm" onsubmit="return false">
        <label>Machine
          <div class="row"><select id="jMachine"></select><button type="button" class="btn" id="mManage">Machines…</button></div>
        </label>
        <label>Hole shape
          <div class="seg" id="jShape">
            <button type="button" data-v="round" class="on">Round</button>
            <button type="button" data-v="square">Square</button>
            <button type="button" data-v="oblong">Oblong/Slot</button>
            <button type="button" data-v="rect">Rectangle</button>
            <button type="button" data-v="hex">Hexagon</button>
            <button type="button" data-v="custom">Custom</button>
          </div>
        </label>
        <div id="jDims" class="dims"></div>
        <div class="two">
          <label>Material thickness (in)
            <div class="combo">
              <input id="jThk" inputmode="decimal" value="1/4" placeholder="10 ga or 1/4" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="thkMenu">
              <button type="button" class="combo-btn" id="thkOpen" aria-label="Show thicknesses and gauges">▾</button>
              <ul class="combo-menu" id="thkMenu" role="listbox" hidden></ul>
            </div>
            <span class="thk-now" id="thkNow"></span>
          </label>
          <label>Material<select id="jMat"></select></label>
        </div>
        <p class="hint">Type a fraction (11/16, 1-3/32) or a decimal (.6875). Thickness also takes a gauge (10 ga).</p>
      </form>
      <div class="results" id="jResult"></div>
    </div>
  </section>


  <section id="tooling" class="panel">
    <div class="card">
      <div class="toolbar">
        <input id="qSearch" type="search" placeholder="Search size (3/4, .75), F16, location, notes…">
        <div class="seg" id="qKind">
          <button type="button" data-v="" class="on">All</button>
          <button type="button" data-v="punch">Punches</button>
          <button type="button" data-v="die">Dies</button>
        </div>
      </div>
      <div class="toolbar">
        <button type="button" class="btn primary" id="qAdd">+ Add tooling</button>
        <button type="button" class="btn" id="qExpJson">Export JSON</button>
        <button type="button" class="btn" id="qExpCsv">Export CSV</button>
        <label class="btn filebtn">Import JSON/CSV<input type="file" id="qImport" accept=".json,.csv,application/json,text/csv"></label>
        <label class="chk"><input type="checkbox" id="qReplace"> Replace whole list on import</label>
      </div>
      <p class="hint" id="qMsg"></p>
      <table class="inv"><thead><tr><th>Size</th><th>Type</th><th>Group</th><th>Shape</th><th>Status</th><th>Qty</th><th>Location</th><th>Notes</th><th></th></tr></thead><tbody id="qBody"></tbody></table>
      <p class="hint" id="qNote"></p>
    </div>
  </section>
</main>
<dialog id="toolDlg"><form method="dialog" id="toolForm" class="dlg">
  <h2 id="toolTitle">Add tooling</h2>
  <div class="two">
    <label>Type<div class="seg" id="fKind"><button type="button" data-v="punch" class="on">Punch</button><button type="button" data-v="die">Die</button></div></label>
    <label>Group<select id="fGroup"></select></label>
    <label id="fCustomWrap" hidden>Custom group name<input id="fCustom" placeholder="e.g. Oversize 241"></label>
    <label>Shape<select id="fShape"><option value="round">Round</option><option value="square">Square</option><option value="oblong">Oblong</option><option value="other">Other</option></select></label>
    <label><span id="fSizeLbl">Diameter (in)</span><input id="fSize" inputmode="decimal" list="sizeList" placeholder="e.g. 11/16"></label>
    <label id="fLenWrap" hidden>Length (in)<input id="fLen" inputmode="decimal" placeholder="e.g. 1-1/8"></label>
    <label>Quantity (blank = not counted)<input id="fQty" inputmode="numeric" placeholder="e.g. 2"></label>
    <label>Location (optional)<input id="fLoc" placeholder="e.g. Drawer 3"></label>
  </div>
  <label>Notes<input id="fNotes" placeholder="Optional"></label>
  <p class="err" id="fErr"></p>
  <div class="row end">
    <button type="button" class="btn danger" id="fDelete">Remove</button>
    <button type="button" class="btn" id="fRevert">Revert to sheet</button>
    <span class="grow"></span>
    <button type="button" class="btn" value="cancel" id="fCancel">Cancel</button>
    <button type="button" class="btn primary" id="fSave">Save</button>
  </div>
</form></dialog>

<dialog id="machDlg"><form method="dialog" class="dlg">
  <h2>Machines</h2>
  <div id="mList"></div>
  <h3 id="mEditTitle">Add machine</h3>
  <div class="two">
    <label>Name<input id="mName" placeholder="e.g. Piranha P-50"></label>
    <label>Rated tons<input id="mTons" inputmode="decimal"></label>
    <label>Punch max dia (in, optional)<input id="mDia" inputmode="decimal"></label>
    <label>Punch max thickness (in, optional)<input id="mThk" inputmode="decimal"></label>
  </div>
  <p class="err" id="mErr"></p>
  <div class="row end"><button type="button" class="btn" id="mNew">New</button><span class="grow"></span><button type="button" class="btn" id="mClose">Close</button><button type="button" class="btn primary" id="mSave">Save machine</button></div>
</form></dialog>

<datalist id="sizeList"></datalist>
<footer id="foot"></footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
